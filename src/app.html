<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Browser chrome matches --paper (src/routes/layout.css) in each colour scheme. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf8f2" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15140f" />
		<script>
			// Mark that scripts run, so layouts JavaScript finishes (the tricks masonry) can wait for it.
			document.documentElement.dataset.js = "";
			// Apply a saved theme before first paint. Without one the page follows the system setting.
			try {
				const theme = localStorage.getItem("earshot:theme");
				if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
			} catch {}
			// Apply saved reading settings (src/lib/ReaderSettings.svelte) the same way. Unknown values match no CSS.
			try {
				const reader = JSON.parse(localStorage.getItem("earshot:reader") ?? "{}");
				for (const name of ["textSize", "spacing", "font"]) {
					if (typeof reader[name] === "string") document.documentElement.dataset[name] = reader[name];
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
