name: Deploy

# Builds the site for one environment and deploys it to its Worker (wrangler.jsonc).
on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy per environment at a time; a newer push waits rather than cancelling a deploy.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://seo.mia.cx' || 'https://staging.seo.mia.cx' }}
    env:
      SITE_URL: ${{ inputs.environment == 'production' && 'https://seo.mia.cx' || 'https://staging.seo.mia.cx' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Staging stays out of search: every response, Markdown copies and skill files included, says
      # noindex. The Cloudflare adapter serves a _headers file from the project root.
      - name: Keep staging out of search
        if: inputs.environment == 'staging'
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > _headers
      - run: pnpm build
      # Compares the build with the pages still live, so only pages this release changes, adds or
      # drops go to IndexNow. If the comparison fails or takes over a minute, the ping sends every
      # page instead, and the deploy goes ahead.
      - name: Find changed pages
        id: changed
        if: inputs.environment == 'production'
        continue-on-error: true
        run: timeout 60 node scripts/indexnow.ts "$SITE_URL" > "$RUNNER_TEMP/changed.txt"
      - run: pnpm exec wrangler deploy ${{ inputs.environment == 'staging' && '--env staging' || '' }}
      # Tells the IndexNow search engines (Bing, Yandex, Seznam, Naver) which pages changed, so they
      # recrawl without waiting for their own schedule. static/<key>.txt proves the site is ours. A
      # failed or stalled ping leaves the release alone.
      - name: Ping IndexNow
        if: inputs.environment == 'production'
        continue-on-error: true
        env:
          INDEXNOW_KEY: e064b5957e6be3c51732ac04d153af69
        run: |
          changed="$RUNNER_TEMP/changed.txt"
          if [ "${{ steps.changed.outcome }}" != success ]; then
            grep -oP '(?<=<loc>)[^<]+' .svelte-kit/cloudflare/sitemap.xml > "$changed"
          fi
          if [ ! -s "$changed" ]; then echo 'No page changed.'; exit 0; fi
          cat "$changed"
          jq -Rn --arg site "$SITE_URL" --arg key "$INDEXNOW_KEY" \
            '{host: ($site | ltrimstr("https://")), key: $key, keyLocation: "\($site)/\($key).txt", urlList: [inputs]}' \
            < "$changed" \
            | curl -sS --fail-with-body --max-time 30 -H 'Content-Type: application/json; charset=utf-8' --data @- https://api.indexnow.org/indexnow
